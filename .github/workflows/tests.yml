name: Calibration and training
on: [push, pull_request]
jobs:
  cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
      - run: neural-grey demo --device cpu --output outputs/demo --stop-after 1
      - run: neural-grey resume outputs/demo/training.pt --device cpu --output outputs/demo
